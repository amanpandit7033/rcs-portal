{% extends "base.html" %}

{% block title %}Check Your Email{% endblock %}

{% block public_content %}
<div class="bg-white border border-slate-200/90 py-8 px-6 shadow-sm rounded-2xl sm:px-10 text-center">
    <div class="mx-auto w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 mb-4 border border-blue-200 shadow-2xs">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    </div>
    <h3 class="text-xl font-bold text-slate-900 tracking-tight">Password Reset Sent</h3>
    <p class="text-xs text-slate-500 mt-2 leading-relaxed max-w-sm mx-auto">
        If an account exists with that email, we have sent instructions to reset your password. Please check your inbox (and spam folder).
    </p>
    <div class="mt-6">
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200 shadow-2xs transition-colors">
            Return to Login
        </a>
    </div>
</div>
{% endblock %}
