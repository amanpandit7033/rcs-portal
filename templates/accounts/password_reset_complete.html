{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block public_content %}
<div class="bg-white border border-slate-200/90 py-8 px-6 shadow-sm rounded-2xl sm:px-10 text-center">
    <div class="mx-auto w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600 mb-4 border border-emerald-200 shadow-2xs">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <h3 class="text-xl font-bold text-slate-900 tracking-tight">Password Reset Successfully</h3>
    <p class="text-xs text-slate-500 mt-2 leading-relaxed max-w-sm mx-auto">
        Your new password has been set. You can now proceed to log in with your updated credentials.
    </p>
    <div class="mt-6">
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 shadow-xs transition-colors">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
