{% extends "base.html" %}

{% block title %}Account Locked{% endblock %}

{% block public_content %}
<div class="bg-white border border-slate-200/90 py-8 px-6 shadow-sm rounded-2xl sm:px-10 text-center">
    <div class="mx-auto w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-600 mb-4 border border-rose-200 shadow-2xs">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
    </div>
    <h3 class="text-xl font-bold text-slate-900 tracking-tight">Too Many Failed Attempts</h3>
    <p class="text-xs text-slate-500 mt-2 leading-relaxed max-w-sm mx-auto">
        Your account has been temporarily locked for security reasons due to multiple consecutive failed login attempts.
    </p>
    <div class="mt-6">
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200 shadow-2xs transition-colors">
            Return to Login
        </a>
    </div>
</div>
{% endblock %}
