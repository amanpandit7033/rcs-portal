{% extends "base.html" %}

{% block title %}Edit Group: {{ group.name }} - RCS Portal{% endblock %}
{% block header_title %}Edit Contact Group{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Edit Contact Group</h1>
            <p class="text-xs text-slate-500 mt-0.5">Update group identity and details.</p>
        </div>
        <a href="{% url 'campaigns:group_detail' group.id %}" class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
            &larr; Back to Group
        </a>
    </div>

    <!-- Edit Form Card -->
    <form method="post" class="bg-white rounded-2xl border border-slate-200/80 shadow-2xs p-6 space-y-5">
        {% csrf_token %}

        <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-700">
                Group Name <span class="text-rose-500">*</span>
            </label>
            <input type="text"
                   name="name"
                   value="{{ group.name }}"
                   required
                   class="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-[#283891] text-slate-900">
        </div>

        <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-700">
                Description <span class="text-slate-400 font-normal">(Optional)</span>
            </label>
            <textarea
                name="description"
                rows="3"
                class="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-[#283891] text-slate-900"
            >{{ group.description }}</textarea>
        </div>

        <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
            <a href="{% url 'campaigns:group_detail' group.id %}" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                Cancel
            </a>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#283891] hover:bg-[#1f2b70] text-white text-xs font-bold shadow-sm transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <span>Save Changes</span>
            </button>
        </div>
    </form>

</div>
{% endblock %}
